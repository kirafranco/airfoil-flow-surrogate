[pytest]
testpaths = tests
# The project is mounted read-only in the containers, so pytest cannot write its
# cache there; -p no:cacheprovider stops it from warning about that every run.
# The network suite is opt-in: `pytest -m network`.
addopts = -ra -m "not network" -p no:cacheprovider
markers =
    gpu: needs a CUDA device; runs in the ml container and fails, never skips, without one
    network: reaches the real AirfRANS host; opt in with -m network
# Emitted by torch_geometric's own import under torch 2.15; upstream, harmless.
filterwarnings =
    ignore:`torch\.jit\.script` is deprecated:FutureWarning
